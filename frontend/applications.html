<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Applications · AI Placement Assistant</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="css/style.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">AI Placement Assistant</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="applications.html">Applications</a></li>
        <li class="nav-item"><a class="nav-link" href="resume.html">Resume &amp; Job Match</a></li>
        <li class="nav-item"><a class="nav-link" href="assistant.html">AI Assistant</a></li>
        <li class="nav-item"><a class="nav-link" href="documents.html">Documents</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="page-title mb-0">Applications</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#applicationModal" onclick="openCreateModal()">
      + Add Application
    </button>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-6">
          <input type="text" class="form-control" id="searchInput" placeholder="Search by company or role" />
        </div>
        <div class="col-md-4">
          <select class="form-select" id="statusFilter">
            <option value="">All statuses</option>
            <option value="Applied">Applied</option>
            <option value="Shortlisted">Shortlisted</option>
            <option value="Interview">Interview</option>
            <option value="Selected">Selected</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button class="btn btn-outline-light" onclick="loadApplications()">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr><th>Company</th><th>Role</th><th>Package</th><th>Date</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="applicationsBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state d-none">No applications found.</div>
    </div>
  </div>
</div>

<div class="modal fade" id="applicationModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header border-secondary">
        <h5 class="modal-title" id="modalTitle">Add Application</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="applicationForm">
        <div class="modal-body">
          <input type="hidden" id="applicationId" />
          <div class="mb-3">
            <label class="form-label">Company</label>
            <input type="text" class="form-control" id="companyInput" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <input type="text" class="form-control" id="roleInput" required />
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Package / CTC</label>
              <input type="text" class="form-control" id="packageInput" placeholder="e.g. 12 LPA" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Application Date</label>
              <input type="date" class="form-control" id="dateInput" required />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="statusInput">
              <option value="Applied">Applied</option>
              <option value="Shortlisted">Shortlisted</option>
              <option value="Interview">Interview</option>
              <option value="Selected">Selected</option>
              <option value="Rejected">Rejected</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" id="notesInput" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/applications.js"></script>
</body>
</html>
