<link href="css/style.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">AI Placement Assistant</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="applications.html">Applications</a></li>
        <li class="nav-item"><a class="nav-link" href="resume.html">Resume &amp; Job Match</a></li>

<div class="container py-4">
  <h3 class="page-title">Knowledge Base Documents</h3>
  <p class="text-muted">Upload placement guidelines, eligibility criteria, and policy documents. The AI Assistant answers questions using these documents.</p>

  <div class="card mb-4">
    <div class="card-body">
      <label class="form-label">Upload Document (PDF, DOCX, or TXT)</label>
      <input type="file" class="form-control" id="documentFileInput" accept=".pdf,.docx,.txt" />
      <button class="btn btn-primary mt-3" id="uploadBtn">Upload &amp; Process</button>
      <div class="spinner-border text-light mt-3 d-none" id="uploadSpinner"></div>
      <div id="uploadStatus" class="mt-3"></div>
    </div>
  </div>

  <div class="row g-3" id="documentsList"></div>
  <div id="documentsEmptyState" class="empty-state d-none">No documents uploaded yet.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
