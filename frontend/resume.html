<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume &amp; Job Match · AI Placement Assistant</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="css/style.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">AI Placement Assistant</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="applications.html">Applications</a></li>
        <li class="nav-item"><a class="nav-link active" href="resume.html">Resume &amp; Job Match</a></li>
        <li class="nav-item"><a class="nav-link" href="assistant.html">AI Assistant</a></li>
        <li class="nav-item"><a class="nav-link" href="documents.html">Documents</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h3 class="page-title">Resume &amp; Job Match</h3>

  <ul class="nav nav-tabs mb-3" id="resumeTabs">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#analyzePane">Resume Analysis</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#matchPane">Job Description Match</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="analyzePane">
      <div class="card mb-3">
        <div class="card-body">
          <label class="form-label">Upload Resume (PDF, DOCX, or TXT)</label>
          <input type="file" class="form-control" id="analyzeFileInput" accept=".pdf,.docx,.txt" />
          <button class="btn btn-primary mt-3" id="analyzeBtn">Analyze Resume</button>
          <div class="spinner-border text-light mt-3 d-none" id="analyzeSpinner"></div>
        </div>
      </div>
      <div id="analyzeResult"></div>
    </div>

    <div class="tab-pane fade" id="matchPane">
      <div class="card mb-3">
        <div class="card-body">
          <label class="form-label">Upload Resume (PDF, DOCX, or TXT)</label>
          <input type="file" class="form-control mb-3" id="matchFileInput" accept=".pdf,.docx,.txt" />
          <label class="form-label">Job Description</label>
          <textarea class="form-control" id="jobDescriptionInput" rows="6" placeholder="Paste the job description here"></textarea>
          <button class="btn btn-primary mt-3" id="matchBtn">Compare</button>
          <div class="spinner-border text-light mt-3 d-none" id="matchSpinner"></div>
        </div>
      </div>
      <div id="matchResult"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/resume.js"></script>
</body>
</html>
